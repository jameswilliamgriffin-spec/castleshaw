<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Castleshaw Centre | Homepage concepts</title>
  <meta name="description" content="Two homepage concepts for the Castleshaw Centre. Choose a version to explore." />
  <link rel="icon" href="./shared/images/logo.jpg" />
  <script type="module" src="./chooser/chooser.js"></script>
</head>
<body>
  <main class="ch">
    <header class="ch-head">
      <img class="ch-logo" src="./shared/images/logo.jpg" alt="Castleshaw Centre" width="200" height="129" />
      <h1>Two homepage concepts for the Castleshaw Centre. Pick one to explore.</h1>
    </header>
    <ul class="ch-list">
      <li>
        <a class="ch-card" href="./v1/">
          <span class="ch-thumb"><img src="./shared/thumbs/v1.jpg" alt="" width="800" height="500" /></span>
          <span class="ch-name">Version 1</span>
          <span class="ch-desc">Illustrated. The page walks down through the bands of the logo: sky, hills, water.</span>
        </a>
      </li>
      <li>
        <a class="ch-card" href="./v2/">
          <span class="ch-thumb"><img src="./shared/thumbs/v2.jpg" alt="" width="800" height="500" /></span>
          <span class="ch-name">Version 2</span>
          <span class="ch-desc">Illustrated, then the hills come alive as a cinematic film you steer by scrolling.</span>
        </a>
      </li>
    </ul>
    <svg class="ch-ridge" viewBox="0 0 1600 160" preserveAspectRatio="none" aria-hidden="true">
      <path fill="#c1d284" d="M0 160 L0 70 C200 30 380 40 560 62 S900 96 1100 58 S1450 20 1600 44 L1600 160 Z" />
      <path fill="#8dba08" d="M0 160 L0 110 C260 80 520 92 760 112 S1240 128 1600 96 L1600 160 Z" />
      <rect fill="#0480bc" y="146" width="1600" height="14" />
    </svg>
  </main>
</body>
</html>
